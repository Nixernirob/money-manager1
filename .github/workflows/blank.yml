name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # গ্লোবাল গ্রেডল এনভায়রনমেন্ট সেটআপ করা (যেহেতু gradlew ফাইল মিসিং)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # বিল্ড রান করা (gradlew না থাকলে সরাসরি gradle কমান্ড ব্যবহার করবে)
    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          echo "Using gradlew wrapper..."
          DIR_PATH=$(dirname "$GRADLEW_PATH")
          cd "$DIR_PATH"
          chmod +x ./gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew not found. Searching for build.gradle instead..."
          BUILD_GRADLE_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_GRADLE_PATH" ]; then
            echo "Error: No Android project files found at all!"
            exit 1
          fi
          DIR_PATH=$(dirname "$BUILD_GRADLE_PATH")
          cd "$DIR_PATH"
          gradle assembleDebug
        fi
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    # জেনারেট হওয়া APK ফাইল আপলোড করা
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug-apk
        path: '**/build/outputs/apk/debug/*.apk'
