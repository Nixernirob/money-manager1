name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # ফোল্ডারের ভেতর gradlew ফাইলটি যেখানেই থাকুক না কেন তা খুঁজে বের করে পারমিশন দেবে
    - name: Find and Grant execute permission for gradlew
      run: |
        find . -name "gradlew" -exec chmod +x {} \;
        find . -name "gradlew"

    # সাব-ফোল্ডার চেক করে স্বয়ংক্রিয়ভাবে সঠিক জায়গায় বিল্ড রান করবে
    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found anywhere in the repository!"
          exit 1
        fi
        DIR_PATH=$(dirname "$GRADLEW_PATH")
        cd "$DIR_PATH"
        ./gradlew assembleDebug
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    # তৈরি হওয়া যেকোনো APK ফাইল খুঁজে বের করে আপলোড করবে
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug-apk
        path: '**/build/outputs/apk/debug/*.apk'
