name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # গ্লোবাল গ্রেডল সেটআপ
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # মিসিং debug.keystore ফাইলটি স্বয়ংক্রিয়ভাবে তৈরি করার কমান্ড
    - name: Generate missing debug.keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        # যদি মেইন ডিরেক্টরি ছাড়া অন্য কোথাও ফাইলটি খোঁজে, তার জন্য সব জায়গায় কপি করে দেওয়া হলো
        find . -type d -name "app" -exec cp debug.keystore {} \;
        cp debug.keystore /home/runner/work/money-manager1/money-manager1/ || true

    # বিল্ড রান করা
    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR_PATH=$(dirname "$GRADLEW_PATH")
          cd "$DIR_PATH"
          chmod +x ./gradlew
          ./gradlew assembleDebug
        else
          BUILD_GRADLE_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          DIR_PATH=$(dirname "$BUILD_GRADLE_PATH")
          cd "$DIR_PATH"
          gradle assembleDebug
        fi
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    # তৈরি হওয়া APK ফাইল আপলোড করা
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug-apk
        path: '**/build/outputs/apk/debug/*.apk'# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
