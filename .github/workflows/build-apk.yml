name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Prepare build environment and keystore
    - name: Configure Gradle properties & Generate debug.keystore
      run: |
        # Generate debug keystore for signing
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        find . -type d -name "app" -exec cp debug.keystore {} \; || true
        
        # Ensure out-of-process Kotlin compilation daemon on CI to prevent Compose compiler plugin classloader conflicts
        sed -i 's/kotlin.compiler.execution.strategy=in-process/kotlin.compiler.execution.strategy=daemon/g' gradle.properties || true
        echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" >> gradle.properties
        echo "kotlin.compiler.execution.strategy=daemon" >> gradle.properties

    # Build Android APK
    - name: Build APK with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR_PATH=$(dirname "$GRADLEW_PATH")
          cd "$DIR_PATH"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace -Dkotlin.compiler.execution.strategy=daemon -Djava.awt.headless=true
        else
          BUILD_GRADLE_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          DIR_PATH=$(dirname "$BUILD_GRADLE_PATH")
          cd "$DIR_PATH"
          gradle assembleDebug --stacktrace -Dkotlin.compiler.execution.strategy=daemon -Djava.awt.headless=true
        fi
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GRADLE_OPTS: "-Dkotlin.compiler.execution.strategy=daemon -Djava.awt.headless=true"

    - name: Find and Rename APK
      run: |
        APK_FILE=$(find . -name "*.apk" -path "*/build/outputs/apk/debug/*" | head -n 1)
        if [ -n "$APK_FILE" ]; then
          cp "$APK_FILE" ./aureum-wallet-release.apk
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aureum-wallet-apk
        path: './aureum-wallet-release.apk'

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: ${{ github.ref_name == 'main' && 'v1.0.0' || (github.ref_name == 'master' && 'v1.0.0' || github.ref_name) }}
        name: "Aureum Wallet ${{ github.ref_name == 'main' && 'v1.0.0' || (github.ref_name == 'master' && 'v1.0.0' || github.ref_name) }}"
        body: |
          ## Aureum Wallet Release
          - Automated build generated via GitHub Actions.
          - Download the attached `.apk` file below and install it directly on your Android device.
        files: ./aureum-wallet-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
